<title>Rendez-vous</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout : appli à deux faces (client / pro) — barre haute, vues routées par #, cartes nettes sur fond bleuté. */
:root{
  --brand:#1758e6;--brand-dark:#0f43b8;--brand-deep:#0a2f86;--brand-soft:#e8effd;--brand-softer:#f3f7fe;
  --ink:#0b1f3a;--ink-soft:#4a5b75;--canvas:#f2f5f9;--surface:#ffffff;--line:#dce3ec;
  --sun:#ffc93c;--head:#1758e6;--ok:#0f8a5f;--ok-soft:#e6f5ee;--bad:#d92d3a;--bad-soft:#fdecee;--warn:#b26a00;--warn-soft:#fff4dc;
  --shadow:0 1px 2px rgb(11 31 58/.06),0 2px 8px rgb(11 31 58/.05);--pop:0 12px 32px rgb(11 31 58/.16);
  --map-land:#eef1ec;--map-park:#cfe6c6;--map-water:#a9d0ee;--map-road:#ffffff;--map-road-edge:#d9dfe6;--map-major:#ffe7a8;--map-text:#5a6878;
  --f-display:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --map-land:#152033;--map-park:#18352a;--map-water:#1d3b5e;--map-road:#26354d;--map-road-edge:#0e1726;--map-major:#4a4027;--map-text:#9fb0c8;
  --brand:#5b8cff;--brand-dark:#3f74f5;--brand-deep:#0b1c45;--head:#173a8f;--brand-soft:#16264a;--brand-softer:#111d38;
  --ink:#e8eef8;--ink-soft:#9fb0c8;--canvas:#0a1222;--surface:#111b2e;--line:#22314b;
  --ok:#3ccf95;--ok-soft:#0f2b22;--bad:#ff6b76;--bad-soft:#36161b;--warn:#ffc35c;--warn-soft:#33270e;
  --shadow:0 1px 2px rgb(0 0 0/.3);--pop:0 12px 32px rgb(0 0 0/.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --map-land:#152033;--map-park:#18352a;--map-water:#1d3b5e;--map-road:#26354d;--map-road-edge:#0e1726;--map-major:#4a4027;--map-text:#9fb0c8;
  --brand:#5b8cff;--brand-dark:#3f74f5;--brand-deep:#0b1c45;--brand-soft:#16264a;--brand-softer:#111d38;
  --ink:#e8eef8;--ink-soft:#9fb0c8;--canvas:#0a1222;--surface:#111b2e;--line:#22314b;
  --ok:#3ccf95;--ok-soft:#0f2b22;--bad:#ff6b76;--bad-soft:#36161b;--warn:#ffc35c;--warn-soft:#33270e;
  --shadow:0 1px 2px rgb(0 0 0/.3);--pop:0 12px 32px rgb(0 0 0/.5);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--canvas);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;height:60px}
.logo{display:flex;align-items:center;gap:8px;font:800 18px var(--f-display);color:var(--ink);text-decoration:none;cursor:pointer;background:none;border:0;padding:0}
.logo i{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--brand);color:#fff;font-style:normal}
.side{display:flex;gap:4px;margin-left:auto;align-items:center}
.seg{display:inline-flex;background:var(--canvas);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:600;font-size:14px;color:var(--ink-soft);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.navlink{border:0;background:none;padding:8px 10px;border-radius:8px;font-weight:600;color:var(--ink-soft);cursor:pointer;font-size:14px}
.mob{display:none}
.navlink:hover,.navlink[aria-current="page"]{color:var(--ink);background:var(--canvas)}
.demo{background:var(--warn-soft);color:var(--warn);font-size:12.5px;font-weight:600;text-align:center;padding:6px 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:10px 16px;font-weight:600;border:1px solid transparent;cursor:pointer;transition:background .15s,transform .05s;text-decoration:none;font-size:15px}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--brand);color:#fff}.btn-primary:hover{background:var(--brand-dark)}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line)}.btn-secondary:hover{border-color:var(--brand)}
.btn-ghost{background:none;color:var(--ink-soft)}.btn-ghost:hover{background:var(--canvas);color:var(--ink)}
.btn-sun{background:var(--sun);color:#0b1f3a}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-sm{padding:6px 11px;font-size:13.5px;border-radius:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)}
label.lbl{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.muted{color:var(--ink-soft)}.small{font-size:13px}.xs{font-size:12px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.brand{background:var(--brand-soft);color:var(--brand)}
.tab{font-variant-numeric:tabular-nums}
/* Accueil */
.hero{background:var(--brand-deep);color:#fff;padding-block:44px 76px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-120px;top:-140px;width:420px;height:420px;border-radius:50%;background:rgb(255 255 255/.06)}
.hero h1{font-size:clamp(28px,4.6vw,46px);max-width:760px;color:#fff}
.hero p{color:rgb(255 255 255/.82);max-width:620px;font-size:17px;margin:12px 0 22px}
.searchbar{display:grid;grid-template-columns:1.3fr 1fr auto;background:var(--surface);border-radius:14px;padding:6px;gap:6px;box-shadow:var(--pop);max-width:860px;position:relative;z-index:1}
.searchbar .field{display:flex;flex-direction:column;padding:6px 12px;min-width:0}
.searchbar .field+.field{border-left:1px solid var(--line)}
.searchbar .field>span{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft)}
.searchbar input{border:0;outline:none;background:none;padding:2px 0;font-size:15.5px;color:var(--ink);min-width:0}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:-40px;position:relative;z-index:2}
.cat{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;text-align:center;cursor:pointer;font-weight:600;font-size:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--ink)}
.cat:hover{border-color:var(--brand);transform:translateY(-2px)}
.ico{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--brand-soft);color:var(--brand)}
.ico svg{width:21px;height:21px}
.section{padding-block:36px}
.section h2{font-size:24px;margin-bottom:16px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.kpi{font:800 28px var(--f-display)}
/* Recherche */
.layout-search{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:18px;padding-block:16px 30px}
.filters .group{padding-block:12px;border-top:1px solid var(--line)}
.filters .group:first-child{border-top:0;padding-top:0}
.result{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:start;cursor:pointer}
.result:hover{border-color:var(--brand)}
.avatar{width:64px;height:64px;border-radius:14px;display:grid;place-items:center;font:800 22px var(--f-display);color:#fff}
.slots-mini{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.slot-mini{border:1px solid var(--brand);color:var(--brand);background:var(--brand-softer);border-radius:8px;padding:4px 9px;font-size:13px;font-weight:700;cursor:pointer}
.stars{color:#f2a900;letter-spacing:1px}
.mapcol{position:sticky;top:calc(env(safe-area-inset-top,0px) + 176px);height:calc(100dvh - 244px);min-height:380px}
.map{position:relative;width:100%;height:100%;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--map-land);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.map:active{cursor:grabbing}.map.picking{cursor:crosshair;box-shadow:inset 0 0 0 3px var(--brand)}
.map svg.base{position:absolute;inset:0;display:block}
.map-place{font:700 11.5px var(--f-body);fill:var(--map-text);text-anchor:middle;paint-order:stroke;stroke:var(--map-land);stroke-width:3px;letter-spacing:.02em}
.map-river{font:italic 600 11px var(--f-body);fill:color-mix(in srgb,var(--map-water) 40%,var(--ink));paint-order:stroke;stroke:var(--map-land);stroke-width:3px}
.map-street{font:500 10px var(--f-body);fill:var(--map-text);text-anchor:middle;paint-order:stroke;stroke:var(--map-land);stroke-width:3px}
.pins{position:absolute;inset:0;pointer-events:none}
.mpin,.cluster{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;font:800 12.5px var(--f-body);white-space:nowrap;transition:background .15s,color .15s,box-shadow .15s}
.mpin{margin:-15px 0 0 -26px;min-width:52px;padding:6px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:0 2px 6px rgb(11 31 58/.18)}
.mpin::after{content:"";position:absolute;left:50%;bottom:-5px;width:9px;height:9px;background:inherit;border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.mpin:hover,.mpin.hot{background:var(--ink);color:var(--surface);z-index:2}
.mpin.on{background:var(--brand);color:#fff;border-color:var(--brand);z-index:3;box-shadow:0 6px 16px rgb(23 88 230/.35)}
.cluster{margin:-19px 0 0 -19px;width:38px;height:38px;border-radius:50%;border:3px solid var(--surface);background:var(--brand);color:#fff;box-shadow:0 0 0 6px color-mix(in srgb,var(--brand) 22%,transparent)}
.mcard{position:absolute;left:0;top:0;width:300px;max-width:calc(100% - 16px);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--pop);z-index:5;cursor:default}
.mc-x{position:absolute;right:6px;top:4px;border:0;background:none;font-size:20px;color:var(--ink-soft);cursor:pointer}
.map-tools{position:absolute;right:10px;bottom:34px;display:grid;gap:6px;z-index:4}
.mt{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 18px var(--f-body);cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow)}
.mt:hover{color:var(--brand)}
.map-here{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:4;box-shadow:var(--pop);border-radius:999px}
.map-scale{position:absolute;left:10px;bottom:10px;z-index:4;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--map-text)}
.map-scale i{display:block;height:5px;border:2px solid var(--map-text);border-top:0}
.map-attr{position:absolute;right:10px;bottom:8px;font-size:10px;color:var(--map-text);z-index:3}
.fsep{flex:0 0 1px;background:var(--line);margin:4px 2px}
.searchtop{position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:15;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);padding-block:10px}
.sbar{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.sfield{display:flex;align-items:center;gap:8px;flex:1 1 200px;min-width:0;background:var(--canvas);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:42px;color:var(--ink)}
.sfield input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:15px}
.locfield{cursor:pointer;font-weight:600;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.locfield span{overflow:hidden;text-overflow:ellipsis}
.searchbar .locfield{border:0;background:none;padding:2px 0;font-size:15.5px;display:flex;align-items:center;gap:6px;color:var(--ink)}
.fbar{display:flex;gap:6px;overflow-x:auto;padding-top:10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.fbar::-webkit-scrollbar{display:none}.fbar .chip{flex:0 0 auto}
.sortchip select{border:0;background:none;font-weight:700;outline:none;cursor:pointer}
.chip-on{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
.hero-chip{background:rgb(255 255 255/.12)!important;border-color:transparent!important;color:#fff!important}
.pop{position:absolute;z-index:45;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--pop);padding:12px}
.pop .opt{gap:12px;justify-content:flex-start}
.fgroup{padding-block:14px;border-top:1px solid var(--line)}.fgroup:first-of-type{border-top:0}
.modal-bg.sheet{place-items:end center}
.modal-bg.sheet .modal{max-width:560px;border-radius:18px 18px 0 0;max-height:88dvh;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@media (min-width:760px){.modal-bg.sheet{place-items:center}.modal-bg.sheet .modal{border-radius:18px}}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
.result{transition:border-color .15s,box-shadow .15s,transform .15s;animation:rise .28s ease-out both;animation-delay:calc(var(--i,0) * 25ms)}
.result:hover,.result.on{border-color:var(--brand);box-shadow:0 6px 20px rgb(11 31 58/.1)}
@keyframes rise{from{transform:translateY(6px)}to{transform:none}}
.price{text-align:right}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,260px);gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.tilebiz{display:grid;gap:4px;text-align:left;scroll-snap-align:start;cursor:pointer;padding:12px}
.tilebiz:hover{border-color:var(--brand);transform:translateY(-2px)}
.cover{display:flex;align-items:flex-start;height:86px;border-radius:10px;padding:10px;margin-bottom:6px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 22%,var(--surface)),color-mix(in srgb,var(--c) 8%,var(--surface)))}
.cover .avatar{width:44px;height:44px;font-size:17px;border-radius:12px}
.tb-name{font-family:var(--f-display);font-size:16px}
.viewtoggle{display:none}
.chat{position:absolute;right:0;bottom:68px;width:min(400px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--pop);overflow:hidden;display:flex;flex-direction:column;max-height:min(620px,calc(100dvh - 120px))}
.chat-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.chat .msgs{flex:1;max-height:none;overflow:auto;padding:14px;display:grid;gap:8px;align-content:start}
.chat-form{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
.chatcard{margin:0;gap:10px;justify-content:flex-start;padding:8px 10px}
.msg{white-space:pre-wrap;line-height:1.45}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--ink-soft);animation:blink 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.fab{height:52px;min-width:52px;border-radius:999px;border:0;background:var(--brand);color:#fff;box-shadow:var(--pop);cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:0 18px;font-weight:700}
.fab:hover{background:var(--brand-dark)}
/* Fiche */
.bizhead{background:var(--head);color:#fff;padding-block:22px}
.layout-biz{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;padding-block:20px}
.svc{display:flex;justify-content:space-between;gap:12px;align-items:center;padding-block:12px;border-top:1px solid var(--line)}
.svc:first-child{border-top:0}
.booking{position:sticky;top:76px;padding:0;overflow:auto;max-height:calc(100dvh - 92px)}
.booking h3{background:var(--brand-softer);padding:14px 18px;font-size:17px;border-bottom:1px solid var(--line)}
.bstep{padding:14px 18px;border-bottom:1px solid var(--line)}
.bstep h4{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:8px}
.num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;font-size:12px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer;margin-bottom:8px}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-softer);box-shadow:inset 0 0 0 1px var(--brand)}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.day{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;text-align:center;cursor:pointer;min-width:58px}
.day b{display:block;font-size:16px}
.day[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.slotgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.slot{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 0;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--brand)}
.slot[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.slot:disabled{color:var(--ink-soft);text-decoration:line-through;opacity:.5;cursor:not-allowed}
.sum{display:grid;gap:6px;font-size:14px}
.sum div{display:flex;justify-content:space-between;gap:10px}
.notice{background:var(--canvas);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--ink-soft)}
details.faq{border-top:1px solid var(--line);padding-block:12px}
details.faq summary{cursor:pointer;font-weight:600;list-style:none}
details.faq[open] summary{color:var(--brand)}
/* Pro */
.layout-pro{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;padding-block:20px}
.pronav{display:flex;flex-direction:column;gap:2px}
.pronav button{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:none;padding:9px 12px;border-radius:10px;font-weight:600;color:var(--ink-soft);cursor:pointer}
.pronav button[aria-current="page"]{background:var(--brand);color:#fff}
.pronav svg{width:17px;height:17px;flex:0 0 auto}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile .lab{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft)}
.tile .val{font:800 26px var(--f-display);margin-top:4px}
.bar{height:8px;background:var(--canvas);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px}
.appt{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:12px;align-items:center;padding-block:12px;border-top:1px solid var(--line)}
.appt:first-child{border-top:0}
.time{font:800 17px var(--f-display)}
.spark{display:flex;align-items:flex-end;gap:4px;height:70px}
.spark i{flex:1;background:var(--brand-soft);border-radius:4px 4px 0 0;position:relative}
.spark i.last{background:var(--brand)}
.check{display:flex;gap:12px;padding-block:11px;border-top:1px solid var(--line);align-items:flex-start}
.check:first-child{border-top:0}

})();

// ---------- Compagnon IA (Claude via la page, outils de recherche réels) ----------
let chatOpen=false,chat=[],chatBusy=null,sampleFn,sampleReady=false;
const RULES=`Tu es le compagnon de Rendez-vous, une application de prise de rendez-vous à Lyon et Villeurbanne (coiffeurs, barbiers, instituts, massages, coachs, garages, detailing, plombiers, toilettage, cours, conseil, restaurants).
Règles :
- Utilise l'outil "chercher" pour toute demande de professionnel : il applique aussi les filtres à l'écran et met la carte à jour. Utilise "details" pour les prix, prestations, horaires et prochains créneaux d'un établissement précis, et "position" quand l'utilisateur indique un quartier.
- Réponds en français, vouvoiement, 1 à 4 phrases courtes, ton naturel. Pas d'emoji, pas de liste à puces sauf pour comparer 2 ou 3 établissements.
- N'invente jamais un établissement, un prix, un horaire ou un avis : uniquement ce que renvoient les outils.
- Tu ne réserves, ne paies et n'annules jamais à la place de l'utilisateur : indique le créneau et dis qu'il peut toucher la carte ou le créneau affiché pour réserver.
- Pour un litige, un remboursement ou un problème de compte, propose de contacter l'équipe à bonjour@rendez-vous.app.`;
const TOOLS=()=>[
 {name:"chercher",description:"Cherche des établissements autour de la position de l'utilisateur, applique les filtres à l'écran et renvoie les 6 premiers (id, nom, métier, note, nb_avis, prix_des, distance_km, quartier, ouvert, prochain_creneau) et le total.",
  inputSchema:{type:"object",properties:{
   texte:{type:"string",description:"Mots-clés libres : prestation ou nom (ex. balayage, dégradé). Vide si seul le métier compte."},
   metier:{type:"string",enum:CATS.map(c=>c.slug)},
   prix_max:{type:"number"},note_min:{type:"number"},distance_max_km:{type:"number"},
   disponibilite:{type:"string",enum:["","today","tomorrow","evening","weekend"]},
   lieu:{type:"string",enum:["","on_site","at_home","online"]},
   ouvert_maintenant:{type:"boolean"},
   options:{type:"array",items:{type:"string",enum:Object.keys(TAGS)}},
   tri:{type:"string",enum:["pertinence","distance","dispo","prix","note","avis"]}}},
  execute(i){Object.assign(V,F0,{q:String(i.texte||""),cat:CATS.some(c=>c.slug===i.metier)?i.metier:null,maxPrice:Number(i.prix_max)||400,minRating:Number(i.note_min)||0,radius:Number(i.distance_max_km)||0,avail:["today","tomorrow","evening","weekend"].includes(i.disponibilite)?i.disponibilite:"",mode:["on_site","at_home","online"].includes(i.lieu)?i.lieu:"",openNow:Boolean(i.ouvert_maintenant),tags:Array.isArray(i.options)?i.options.filter(t=>TAGS[t]):[],sort:["distance","dispo","prix","note","avis"].includes(i.tri)?i.tri:"pertinence"});
   if(S.mode==="pro"){S.mode="client"}go("recherche",{view:"list"});const list=filtered();chatCards=list.slice(0,4).map(b=>b.id);
   return {total:list.length,position:loc().label,resultats:list.slice(0,6).map(b=>({id:b.id,nom:b.name,metier:catOf(b.cat).label,note:b.rating,nb_avis:b.reviews,prix_des:minPrice(b)/100,distance_km:dist(b),quartier:b.q,ouvert:openState(b).label,prochain_creneau:nextSlots(b,1)[0]?.label||null}))}}},
 {name:"details",description:"Détails d'un établissement par id : adresse, prestations avec prix et durée, horaires de la semaine, équipements, 6 prochains créneaux libres.",
  inputSchema:{type:"object",properties:{id:{type:"string"}},required:["id"]},
  execute(i){const b=BY[String(i.id)];if(!b)throw new Error("id inconnu");chatCards=[b.id];return {nom:b.name,adresse:b.addr,distance_km:dist(b),note:b.rating,nb_avis:b.reviews,etat:openState(b).label,lieux:b.modes,equipements:b.tags.map(t=>TAGS[t]),prestations:b.services.map(s=>({nom:s.name,prix_des:startPrice(s)/100,duree_min:s.dur,options:(s.variants||[]).map(v=>v[0])})),horaires:Object.fromEntries(Object.entries(hoursOf(b)).map(([d,h])=>[["dim","lun","mar","mer","jeu","ven","sam"][d],h.join("-")])),creneaux:nextSlots(b,6).map(s=>s.label),empreinte_bancaire_pct:b.guarantee||0,carte_cadeau:b.gift}}},
 {name:"position",description:"Place la position de l'utilisateur sur un quartier de Lyon (pour les distances). Renvoie le quartier retenu.",
  inputSchema:{type:"object",properties:{quartier:{type:"string",enum:QUARTIERS.map(q=>q[0])}},required:["quartier"]},
  execute(i){const q=QUARTIERS.find(x=>x[0]===i.quartier)||QUARTIERS.find(x=>norm(x[0]).includes(norm(String(i.quartier||"")).split(" ")[0]));if(!q)throw new Error("quartier inconnu");S.loc={label:q[0],lat:q[1],lng:q[2],src:"quartier"};save();return {position:q[0]}}}
];
let chatCards=[];
function localAnswer(q){
  const n=norm(q);const c=CATS.find(x=>n.includes(norm(x.label).split(" ")[0].slice(0,6)));
  const qt=QUARTIERS.find(x=>n.includes(norm(x[0]).split(" ")[0]));if(qt)S.loc={label:qt[0],lat:qt[1],lng:qt[2],src:"quartier"};
  const pm=n.match(/(?:moins de|max(?:imum)?|<)\s*(\d+)/);
  Object.assign(V,F0,{cat:c?c.slug:null,q:c?"":q.replace(/[?!.]/g,"").split(" ").filter(w=>w.length>4).slice(0,1).join(""),avail:/ce soir|soiree/.test(n)?"evening":/aujourd|maintenant/.test(n)?"today":/demain/.test(n)?"tomorrow":/week/.test(n)?"weekend":"",mode:/domicile|chez moi/.test(n)?"at_home":/visio|en ligne/.test(n)?"online":"",maxPrice:pm?Number(pm[1]):400,sort:/mieux note|meilleur/.test(n)?"note":/pres|proche|autour/.test(n)?"distance":"pertinence"});
  let list=filtered();if(!list.length&&V.q){V.q="";list=filtered()}
  go("recherche",{view:"list"});chatCards=list.slice(0,3).map(b=>b.id);
  return list.length?`J'ai trouvé ${list.length} résultat${list.length>1?"s":""} autour de ${loc().label}, affiché${list.length>1?"s":""} sur la carte. Le plus adapté : ${list[0].name}, ${fmtKm(dist(list[0]))}, ${list[0].rating.toLocaleString("fr-FR")} ★, prochain créneau ${nextSlots(list[0],1)[0]?.label||"la semaine prochaine"}.`:"Je n'ai rien trouvé avec ces critères. Essayez sans limite de prix ou un autre quartier.";
}
async function ask(q){
  q=q.trim();if(!q||chatBusy)return;chatOpen=true;chat.push({role:"user",content:q});chatCards=[];chat.push({role:"assistant",content:"",pending:true});renderAssistant();
  const bubble=chat[chat.length-1];
  if(sampleFn){
    const ctl=new AbortController();chatBusy=ctl;renderAssistant();
    const turns=[{role:"user",content:RULES+`\n\nPosition actuelle de l'utilisateur : ${loc().label}. Date : ${new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}, ${new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}.`},...chat.slice(-9,-1).filter(m=>m.content).map(m=>({role:m.role,content:m.content}))];
    try{const r=await sampleFn(turns,{tools:TOOLS(),modelTier:"quick",signal:ctl.signal,onText:({text})=>{bubble.content=text;bubble.pending=false;paintBubble()}});bubble.content=r.text}
    catch(e){if(e&&(e.code==="not_granted"||e.code==="sampling_disabled"||e.code==="tools_unavailable"||e.code==="capability_disabled")){sampleFn=null;bubble.content=localAnswer(q)}else if(e&&e.code==="cancelled"){bubble.content=e.text||"Arrêté."}else if(e&&e.code==="rate_limited"){bubble.content="Beaucoup de demandes en ce moment : réessayez dans une minute."}else{bubble.content=(e&&e.text)||localAnswer(q)}}
    finally{chatBusy=null;bubble.pending=false}
  }else bubble.content=localAnswer(q);
  bubble.cards=chatCards.slice();bubble.pending=false;renderAssistant();
}
function paintBubble(){const el=document.querySelector(".msg.bot.live");if(el){el.textContent=chat[chat.length-1].content;const m=document.getElementById("msgs");if(m)m.scrollTop=m.scrollHeight}}
function renderAssistant(){
  const el=document.getElementById("assistant");
  if(S.mode==="pro"){el.innerHTML="";return}
  const sugg=["Un barbier ouvert ce soir près de moi","Massage à domicile moins de 70 €","Le garage le mieux noté","Prochain créneau chez Salon Élégance"];

  if(d.protab){V.proTab=d.protab;render();return}
  if(d.st){const k=S.bookings.find(x=>x.id===d.id);const prev=k.status;k.status=d.st;
    if(d.st==="no_show"&&k.guarantee&&!k.feeCharged){k.feeCharged=true;toast(`Absence enregistrée : ${eur(k.guarantee)} prélevés sur la carte de ${k.client}, versés sur votre compte.`)}
    else if(prev==="no_show"&&k.feeCharged){k.feeCharged=false;toast("Corrigé : les frais d'absence ont été remboursés au client.")}
    else toast(d.st==="completed"?"Marqué venu. Une demande d'avis part ce soir.":"Mis à jour");save();render();return}
  if(d.fix){if(d.fix==="photo"){S.listing.photo=true;toast("Photo ajoutée : +10 points")}else if(d.fix==="ia"){document.getElementById("ia").scrollIntoView({behavior:"smooth"});return}else toast("Ajoutez votre site et votre téléphone dans « Ma page ».");save();render();return}
  if(d.write!==undefined){const out=document.getElementById("ia-out");const notes=document.getElementById("ia-notes").value.trim();
    const txt=`Salon Élégance vous accueille au cœur de Lyon, rue de la République, pour des coupes faciles à coiffer et des couleurs naturelles. Julie, Karim et Inès réalisent coupes femme et homme, brushings et balayages, avec un diagnostic offert avant chaque prestation.${notes?" "+notes.charAt(0).toUpperCase()+notes.slice(1)+(/[.!?]$/.test(notes)?"":"."):""}\n\nComptez 45 € pour une coupe avec brushing et 120 € pour un balayage, prix exacts affichés avant de réserver. Le salon est ouvert du lundi au samedi, jusqu'à 20 h le jeudi et le vendredi, et accessible aux personnes à mobilité réduite.\n\nRéservez en ligne en quelques secondes, 24 h/24 : vous voyez les créneaux libres en temps réel et recevez un rappel la veille.`;
    out.innerHTML=`<div class="notice" style="margin-top:12px;background:var(--brand-softer)"><label class="lbl" for="ia-txt">Proposition (modifiable)</label><textarea class="input" id="ia-txt" rows="9">${esc(txt)}</textarea><button class="btn btn-primary" style="margin-top:8px" data-publish>Publier sur ma page</button></div>`;return}
  if(d.publish!==undefined){S.listing.desc=document.getElementById("ia-txt").value;save();render();toast("Publié. Google et Bing sont prévenus automatiquement.");return}
  if(d.amt){document.getElementById("ga").value=d.amt;return}
  if(d.try){document.getElementById("rc").value=d.try;return}
  if(d.copy){const el=document.getElementById(d.copy);const v=el.value;navigator.clipboard?.writeText(v).then(()=>toast("Copié"),()=>{el.select();toast("Sélectionné : copiez avec Ctrl+C")});return}
  if(d.annual!==undefined){toast("Passage à l'annuel : 690 € par an au lieu de 828 €. Confirmé.");return}
  if(d.portal!==undefined){toast("Ouverture du portail de facturation sécurisé Stripe");return}
  if(d.cancelplan!==undefined){const m=modal(`<h2 style="font-size:20px">Avant de partir…</h2><p class="muted">Restez avec -50 % pendant 3 mois. Vous gardez vos réservations illimitées, l'empreinte bancaire et votre mise en avant.</p><div class="row" style="gap:8px;margin-top:14px"><button class="btn btn-primary" data-close data-keep>Profiter de -50 %</button><button class="btn btn-ghost" data-close data-quit>Résilier quand même</button></div>`);
    m.addEventListener("click",ev=>{if(ev.target.closest("[data-keep]"))toast("Offre appliquée : -50 % sur vos 3 prochaines factures.");if(ev.target.closest("[data-quit]")){S.plan="free";save();render();toast("Résiliation prise en compte à la fin de la période.")}});return}
  if(d.upgrade!==undefined){S.plan="pro";save();render();toast("Essai Pro activé pour 14 jours. Aucun débit avant la fin de l'essai.");return}
});
document.addEventListener("pointerover",e=>{const r=e.target.closest?.(".result[data-hover]");if(!r||r.dataset.hover===MAP.hover)return;MAP.hover=r.dataset.hover;document.querySelectorAll(".mpin").forEach(p=>p.classList.toggle("hot",p.dataset.mpin===MAP.hover))});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="city-q"){e.preventDefault();document.querySelector("#city-res [data-quartier]")?.click();return}if(e.key==="/"&&!e.target.closest("input,textarea,select")){e.preventDefault();chatOpen=true;renderAssistant();document.getElementById("ci")?.focus()}if(e.key==="Escape")closePop();if(e.key==="Enter"&&e.target.matches("article.result,.pin")){e.target.click()}if(e.key==="Escape")document.querySelector(".modal-bg")?.remove()});
document.addEventListener("input",e=>{
  if(e.target.id==="city-q"){const box=document.getElementById("city-res");const res=citySuggest(e.target.value);box.innerHTML=res.length?res.map(v=>`<button class="chip" data-quartier="${esc(vname(v))}" data-lat="${v[1]}" data-lng="${v[2]}">${esc(vname(v))} <span class="xs muted">${v[4]==="FR"?"":v[4]}</span></button>`).join(""):(VILLES.length?'<span class="xs muted">Aucune commune trouvée.</span>':'<span class="xs muted">Chargement des communes…</span>')}
  if(e.target.id==="d-radius"){V.radius=Number(e.target.value);document.getElementById("d-radius-v").textContent=V.radius?fmtKm(V.radius):"illimitée";clearTimeout(window.__dr);window.__dr=setTimeout(()=>{MAP.keepView=true;render();const b=document.querySelector(".modal .btn-primary[data-close]");if(b)b.textContent=`Voir ${filtered().length} résultat${filtered().length>1?"s":""}`},120)}
  if(e.target.id==="d-price"){V.maxPrice=Number(e.target.value);document.getElementById("d-price-v").textContent=V.maxPrice>=400?"illimité":V.maxPrice+" €";clearTimeout(window.__dp);window.__dp=setTimeout(()=>{MAP.keepView=true;render();const b=document.querySelector(".modal .btn-primary[data-close]");if(b)b.textContent=`Voir ${filtered().length} résultat${filtered().length>1?"s":""}`},120)}
  if(e.target.id==="sq"){V.q=e.target.value;clearTimeout(window.__sq);window.__sq=setTimeout(()=>{const c=CATS.find(x=>norm(x.label)===norm(V.q.trim()));if(c){V.cat=c.slug;V.q=""}render();const el=document.getElementById("sq");el.focus();el.setSelectionRange(el.value.length,el.value.length)},220)}
});
document.addEventListener("change",e=>{
  if(e.target.id==="sort"){V.sort=e.target.value;render()}
  if(e.target.id==="d-cat"){V.cat=e.target.value||null;MAP.keepView=false;render();const md=document.querySelector(".modal");if(md)md.innerHTML=drawer()}
  if(e.target.id==="staff"){BK.staff=e.target.value}
});
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target;
  if(f.id==="f-search"||f.id==="f-search2"){const raw=(document.getElementById(f.id==="f-search"?"q":"sq").value||"").trim();const c=CATS.find(x=>norm(x.label)===norm(raw)||norm(x.label)+"s"===norm(raw));Object.assign(V,F0,{tags:[]});if(c)V.cat=c.slug;else V.q=raw;
    const exact=B.find(b=>norm(b.name)===norm(raw));if(exact){V.biz=exact.id;BK=null;go("fiche");return}go("recherche")}
  if(f.id==="f-book"){const b=BY[V.biz];const q=quote(b);const name=document.getElementById("bn").value.trim(),email=document.getElementById("be").value.trim();
    if(!name||!/^\S+@\S+\.\S+$/.test(email)){toast("Indiquez votre nom et un email valide.");return}
    S.profile={name,email,phone:document.getElementById("bp").value.trim()};
    const k={id:"k"+Date.now(),biz:b.id,svc:q.s.name,variant:q.v[0],staff:BK.staff||b.staff[0],start:BK.slot,dur:q.dur,total:q.total,client:name,email,status:"scheduled",guarantee:q.fee,source:"marketplace",mine:true};
    if(b.generated){S.extraBiz=S.extraBiz||{};S.extraBiz[b.id]=b}
    S.bookings.push(k);save();
    const finish=()=>{modal(`<div style="text-align:center"><span style="display:inline-grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--ok);color:#fff;font-size:28px">✓</span><h2 style="font-size:22px;margin-top:12px">Rendez-vous confirmé</h2><p style="font-weight:700;color:var(--brand);margin:6px 0">${fmtDate(k.start)}</p><p class="muted small">${esc(b.name)} · ${esc(k.svc)}${k.variant?" · "+esc(k.variant):""}<br>Confirmation et invitation calendrier envoyées à ${esc(email)}. Rappel la veille.</p><div class="row" style="justify-content:center;gap:8px;margin-top:14px"><button class="btn btn-primary" data-close data-go="compte">Mes rendez-vous</button><button class="btn btn-secondary" data-close>Fermer</button></div></div>`);BK=null;render()};
    if(q.fee){const m=modal(`<h2 style="font-size:20px">${icon("shield",'width="20" height="20" style="vertical-align:-3px;color:var(--brand)"')} Garantir mon rendez-vous</h2><p class="small muted">Aucun débit aujourd'hui. En cas d'absence sans annulation au moins 24 h avant, ${eur(q.fee)} pourront être prélevés par ${esc(b.name)}.</p>
      <div class="grid" style="gap:10px;margin-top:12px"><button class="btn" style="background:#000;color:#fff" data-pay>Apple Pay</button><button class="btn btn-secondary" data-pay>Google Pay</button>
      <div><label class="lbl" for="cc">Carte bancaire</label><input class="input code" id="cc" value="4242 4242 4242 4242" inputmode="numeric"></div><div class="row" style="gap:8px"><input class="input" value="12 / 29" aria-label="Expiration" style="flex:1"><input class="input" value="123" aria-label="Code de sécurité" style="flex:1"></div>
      <button class="btn btn-primary" data-pay>Enregistrer ma carte et confirmer</button></div><p class="xs muted" style="margin:10px 0 0">Paiement sécurisé par Stripe, conservé pour le compte de ${esc(b.name)}. Démonstration : aucune carte n'est réellement enregistrée.</p>`);
      m.addEventListener("click",ev=>{if(ev.target.closest("[data-pay]")){m.remove();finish()}})}
    else finish();
  }
  if(f.id==="f-chat"){const i=document.getElementById("ci");const q=i.value.trim();if(!q)return;ask(q).then(()=>document.getElementById("ci")?.focus())}
  if(f.id==="f-redeem"){const raw=document.getElementById("rc").value.toUpperCase().replace(/[^A-Z0-9]/g,"");const c=(raw.match(/.{1,4}/g)||[]).join("-");const g=S.gifts.find(x=>x.code===c&&x.biz===PRO);const msg=document.getElementById("rc-msg");
    if(!g){msg.style.color="var(--bad)";msg.textContent="Code inconnu pour votre établissement.";return}
    if(g.status!=="active"){msg.style.color="var(--bad)";msg.textContent="Cette carte a déjà été utilisée.";return}
    g.status="redeemed";save();render();toast(`Carte de ${eur(g.amount)} validée pour ${g.to}.`)}
  if(f.id==="f-gift"){const b=BY[f.dataset.biz];const amt=Number(document.getElementById("ga").value);const to=document.getElementById("gt").value.trim(),from=document.getElementById("gf").value.trim();
    if(!(amt>=10&&amt<=1000)||!to||!from){toast("Indiquez un montant entre 10 et 1 000 € et les deux prénoms.");return}
    const g={code:code(),biz:b.id,amount:amt*100,from,to,status:"active"};S.gifts.unshift(g);save();f.closest(".modal-bg").remove();
    modal(`<div style="text-align:center"><span class="ico" style="margin:0 auto">${icon("gift")}</span><h2 style="font-size:21px;margin-top:10px">Carte cadeau envoyée</h2><p class="muted small">${esc(to)} reçoit ${eur(g.amount)} chez ${esc(b.name)}, valable 1 an.</p><p class="code" style="font-size:20px;font-weight:800;margin:12px 0">${g.code}</p><p class="xs muted">${b.id===PRO?"Passez en mode Pro › Cartes cadeaux pour la valider.":"Le code est à présenter le jour du rendez-vous."}</p><button class="btn btn-primary" data-close>Fermer</button></div>`)}
});
function giftModal(b){modal(`<h2 style="font-size:20px">${icon("gift",'width="20" height="20" style="vertical-align:-3px;color:var(--brand)"')} Offrir ${esc(b.name)}</h2><p class="small muted">Envoyée par email en quelques secondes, valable 1 an. Paiement versé directement à l'établissement.</p>
  <form id="f-gift" data-biz="${b.id}" class="grid" style="gap:10px;margin-top:10px"><div class="row" style="gap:6px">${[30,50,80,100].map(a=>`<button type="button" class="chip" data-amt="${a}">${a} €</button>`).join("")}</div>
  <div><label class="lbl" for="ga">Montant (€)</label><input class="input" id="ga" type="number" min="10" max="1000" value="50"></div>
  <div><label class="lbl" for="gt">Pour</label><input class="input" id="gt" placeholder="Prénom du bénéficiaire" required></div>
  <div><label class="lbl" for="gf">De la part de</label><input class="input" id="gf" value="${esc(S.profile.name)}" required></div>
  <button class="btn btn-primary" type="submit">Payer et envoyer</button><button class="btn btn-ghost" type="button" data-close>Annuler</button></form>`)}

function fromHash(){const h=location.hash.slice(1);if(h.startsWith("fiche-")&&BY[h.slice(6)]){S.mode="client";V.page="fiche";V.biz=h.slice(6)}else if(["accueil","recherche","compte"].includes(h)){S.mode="client";V.page=h}else if(h==="pro"){S.mode="pro"}render()}
window.addEventListener("hashchange",fromHash);
if(S.loc)applyArea(S.loc);
fromHash();
})();
</script>
