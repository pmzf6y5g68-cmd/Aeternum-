name: Rendez-vous prospector

on:
  schedule:
    # Du lundi au vendredi, 5 exécutions (≈ 9h → 17h à Paris) : le plafond du jour est lissé sur la journée.
    - cron: "17 7,9,11,13,15 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "auto = envoi réel dès que la plateforme est prête ; true = simulation ; false = envoi forcé"
        required: true
        default: "auto"
        type: choice
        options: ["auto", "true", "false"]

concurrency:
  group: rdv-prospector
  cancel-in-progress: false

jobs:
  prospect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python -m py_compile scripts/prospector.py
      - run: python scripts/test_prospector.py
      - name: Lancer la prospection
        env:
          # Mode auto par défaut : simulation tant que /api/health/readiness n'est pas entièrement vert,
          # puis envoi réel automatique (paiements live, domaine vérifié, webhooks branchés).
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || vars.DRY_RUN || 'auto' }}
          MAX_EMAILS_PER_DAY: ${{ vars.MAX_EMAILS_PER_DAY || '1500' }}
          HARD_MAX_EMAILS_PER_DAY: ${{ vars.HARD_MAX_EMAILS_PER_DAY || '6000' }}
          WARMUP_START: ${{ vars.WARMUP_START || '40' }}
          WARMUP_GROWTH: ${{ vars.WARMUP_GROWTH || '1.3' }}
          RUNS_PER_DAY: "5"
          CONCURRENCY: ${{ vars.CONCURRENCY || '8' }}
          PROSPECT_COUNTRY: ${{ vars.PROSPECT_COUNTRY || 'FR' }}
          PROSPECT_CITIES: ${{ vars.PROSPECT_CITIES }}
          PROSPECT_CATEGORIES: ${{ vars.PROSPECT_CATEGORIES }}
          MAX_SEARCHES_PER_RUN: ${{ vars.MAX_SEARCHES_PER_RUN }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-haiku-4-5' }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN || 'rendez-vous.app' }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_REPLY_TO: ${{ vars.EMAIL_REPLY_TO }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: python scripts/prospector.py
